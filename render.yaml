services:
  # Backend (API Java)
  - type: web
    name: hackathon-energia-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: hackathon-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: hackathon-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: hackathon-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: PORT
        value: 8080
    healthCheckPath: /api/health  # o el endpoint de salud que tengas

  # Frontend (React/Vue/Angular)
  - type: web
    name: hackathon-energia-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://hackathon-energia-backend.onrender.com/api

databases:
  - name: hackathon-db
    databaseName: hackathon
    user: hackathon
    plan: free  # cambia a starter si necesitas más