# ==========================================
# Perfil: PROD (Heroku / Railway / VPS)
# ==========================================
# Todas las credenciales vienen de variables de entorno de la plataforma.

# Base de datos MySQL en la nube (Aiven, JawsDB, etc.)
# DB_PARAMS opcional: Aiven exige SSL → DB_PARAMS=?sslMode=REQUIRED
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_ENERGI_AI:energiai}${DB_PARAMS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER_MYSQL}
spring.datasource.password=${DB_PASSWORD}

# No dejar que Hibernate altere el esquema en producción; Flyway lo controla
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# API Data Science desplegada (Render, Railway, etc.)
# Si no se define, la app intenta localhost y cae al motor de reglas local (fallback)
app.datascience.base-url=${DATASCIENCE_URL:http://localhost:8000}