# ==========================================
# Configuración General de la Aplicación
# ==========================================
spring.application.name=energia-backend
server.port=8080

# ==========================================
# Configuración de Zona Horaria y Formato de Fechas (Colombia)
# ==========================================
# Establece la zona horaria por defecto para la aplicación
app.timezone=America/Bogota
# Configura Jackson para serializar las fechas en la zona horaria de Colombia
spring.jackson.time-zone=America/Bogota
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ==========================================
# Configuración de Base de Datos H2 (En memoria)
# ==========================================
spring.datasource.url=jdbc:h2:mem:hackathon_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# Configuración de JPA / Hibernate
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Deshabilita open-in-view para evitar advertencias y mejorar el rendimiento
spring.jpa.open-in-view=false

# ==========================================
# Configuración de Consola H2
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Configuración de Swagger / OpenAPI (SpringDoc)
# ==========================================
# Ruta base para la documentación OpenAPI (estándar de SpringDoc, coincide con SecurityConfig)
springdoc.api-docs.path=/v3/api-docs
# Ruta para la interfaz gráfica de Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
# Comportamiento de la UI: 'list' colapsa los endpoints por defecto para una vista más limpia
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.default-models-expand-depth=0
springdoc.swagger-ui.default-model-expand-depth=0

# ==========================================
# Configuración de JWT (JSON Web Token)
# ==========================================
# Clave secreta para firmar los tokens JWT.
# IMPORTANTE: Debe tener al menos 32 caracteres para el algoritmo HS256.
app.jwt.secret=MiClaveSecretaSuperSeguraDeAlMenos32CaracteresParaJWT!!!

# Tiempo de expiración del token en milisegundos.
# 86400000 ms = 24 horas | 3600000 ms = 1 hora.
app.jwt.expiration-ms=86400000