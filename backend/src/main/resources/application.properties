# ==========================================
# Configuraci\u00F3n General
# ==========================================
spring.application.name=energia-backend
server.port=8080

# ==========================================
# Base de Datos MySQL (solo variables de entorno)
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST}/${DB_ENERGI_AI}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER_MYSQL}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Flyway - Desactivado y activo
# ==========================================
#spring.flyway.enabled=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================
# Swagger / OpenAPI
# ==========================================
springdoc.api-docs.path= /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# JWT
# ==========================================
app.jwt.secret=MiClaveSecretaSuperSeguraDeAlMenos32CaracteresParaJWT!!!
app.jwt.expiration-ms=86400000

# ==========================================
# API Data Science (FastAPI)
# ==========================================
app.datascience.base-url=http://localhost:8000
app.datascience.predict-path=/api/v1/predict/
app.datascience.connect-timeout-ms=5000
app.datascience.read-timeout-ms=10000