# ==========================================
# Configuraci\u00F3n General (com\u00FAn para todos los perfiles)
# ==========================================
spring.application.name=energia-backend
# Heroku/Railway inyectan la variable PORT; en local se mantiene 8080
server.port=${PORT:8080}

# ==========================================
# JPA / Hibernate
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Flyway
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==========================================
# Swagger / OpenAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# JWT
# ==========================================
# En producción se DEBE sobreescribir APP_JWT_SECRET con un valor propio
app.jwt.secret=${APP_JWT_SECRET:MiClaveSecretaSuperSeguraDeAlMenos32CaracteresParaJWT!!!}
app.jwt.expiration-ms=86400000

# ==========================================
# CORS (orígenes permitidos, separados por coma)
# ==========================================
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:8080,http://localhost:3000,http://localhost:4200,http://localhost:5173}

# ==========================================
# API Data Science (FastAPI)
# ==========================================
app.datascience.predict-path=/api/v1/predict/
app.datascience.connect-timeout-ms=5000
app.datascience.read-timeout-ms=10000

# ==========================================
# Expone solo el endpoint de salud para monitoreo b\u00E1sico,
# ocultando detalles internos de la app por seguridad.
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never