# ==========================================
# Configuración General de la Aplicación
# ==========================================
spring.application.name=energia-backend
server.port=8080

# ==========================================
# Configuración de Base de Datos H2
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST}/${DB_ENERGI_AI}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER_MYSQL}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# Configuración de JPA / Hibernate
# ==========================================
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql = true

# ==========================================
# Configuración de Consola H2
# ==========================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Configuración de Swagger / OpenAPI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# Configuración de JWT (JSON Web Token)
# ==========================================
# Clave secreta para firmar los tokens JWT
# IMPORTANTE: Debe tener al menos 32 caracteres para el algoritmo HS256
app.jwt.secret=MiClaveSecretaSuperSeguraDeAlMenos32CaracteresParaJWT!!!

# Tiempo de expiración del token en milisegundos
# 86400000 ms = 24 horas | 3600000 ms = 1 hora
app.jwt.expiration-ms=86400000