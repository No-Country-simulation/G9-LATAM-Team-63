version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: energia-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_ENERGI_AI:-energia_db}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: energia-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 3306
      DB_ENERGI_AI: ${DB_ENERGI_AI:-energia_db}
      DB_USER_MYSQL: ${DB_USER_MYSQL:-root}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DATASCIENCE_URL: http://data-science:8000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: energia-frontend
    ports:
      - "3000:80"

  data-science:
    build: ./data-science
    container_name: energia-ds
    ports:
      - "8000:8000"

volumes:
  db_data: